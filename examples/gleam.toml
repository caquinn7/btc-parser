name = "btc_parser_examples"
version = "1.0.0"

description = "Live-data command-line examples for btc_parser."
gleam = ">= 1.16.0"

target = "erlang"
internal_modules = ["btc_parser_examples/internal/*"]

[dependencies]
btc_parser = { path = ".." }
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
argv = ">= 1.0.2 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
