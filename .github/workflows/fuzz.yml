name: fuzz

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup runtimes
        uses: ./.github/actions/setup

      - name: Check root formatting
        run: gleam format --check

      - name: Check fuzz formatting
        working-directory: fuzz
        run: gleam format --check

  seed:
    runs-on: ubuntu-latest

    outputs:
      seed: ${{ steps.generate.outputs.seed }}

    steps:
      - name: Generate seed
        id: generate
        run: echo "seed=$(od -An -N4 -td4 < /dev/urandom | tr -d ' \n')" >> "$GITHUB_OUTPUT"

  fuzz:
    runs-on: ubuntu-latest
    needs: [format, seed]

    strategy:
      fail-fast: false
      matrix:
        suite: [transaction, block]
        include:
          - target: erlang
          - target: javascript
            js_runtime: node
          - target: javascript
            js_runtime: deno
          - target: javascript
            js_runtime: bun

    steps:
      - uses: actions/checkout@v4

      - name: Setup runtimes
        uses: ./.github/actions/setup
        with:
          js_runtime: ${{ matrix.js_runtime }}

      - name: Download fuzz dependencies
        working-directory: fuzz
        run: gleam deps download

      - name: Run fuzz test
        timeout-minutes: 5
        run: |
          if [ "${{ matrix.target }}" = "javascript" ]; then
            ./fuzz/run --target javascript --runtime ${{ matrix.js_runtime }} -- ${{ matrix.suite }} 100000 ${{ needs.seed.outputs.seed }}
          else
            ./fuzz/run --target erlang -- ${{ matrix.suite }} 100000 ${{ needs.seed.outputs.seed }}
          fi
