# Mutation fuzzing runs nightly because block runs are too slow for timely pull
# request feedback. The deep run executes 1,000,000 transaction iterations and
# 100,000 block iterations on Erlang, Node, Deno, and Bun, with a 60-minute
# timeout. All jobs share the same generated seed so equivalent targets replay
# the same mutations.
name: fuzz

on:
  schedule:
    - cron: "0 6 * * *"

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup runtimes
        uses: ./.github/actions/setup

      - name: Check root formatting
        run: gleam format --check

      - name: Check fuzz formatting
        working-directory: fuzz
        run: gleam format --check

  seed:
    runs-on: ubuntu-latest

    outputs:
      seed: ${{ steps.generate.outputs.seed }}

    steps:
      - name: Generate seed
        id: generate
        run: echo "seed=$(od -An -N4 -td4 < /dev/urandom | tr -d ' \n')" >> "$GITHUB_OUTPUT"

  deep-fuzz:
    name: deep fuzz (${{ matrix.suite }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: [format, seed]

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: transaction
            platform: erlang
            target: erlang
            iterations: 1000000
          - suite: block
            platform: erlang
            target: erlang
            iterations: 100000
          - suite: transaction
            platform: javascript, node
            target: javascript
            js_runtime: node
            iterations: 1000000
          - suite: block
            platform: javascript, node
            target: javascript
            js_runtime: node
            iterations: 100000
          - suite: transaction
            platform: javascript, deno
            target: javascript
            js_runtime: deno
            iterations: 1000000
          - suite: block
            platform: javascript, deno
            target: javascript
            js_runtime: deno
            iterations: 100000
          - suite: transaction
            platform: javascript, bun
            target: javascript
            js_runtime: bun
            iterations: 1000000
          - suite: block
            platform: javascript, bun
            target: javascript
            js_runtime: bun
            iterations: 100000

    steps:
      - uses: actions/checkout@v4

      - name: Setup runtimes
        uses: ./.github/actions/setup
        with:
          js_runtime: ${{ matrix.js_runtime }}

      - name: Download fuzz dependencies
        working-directory: fuzz
        run: gleam deps download

      - name: Run deep fuzz test
        timeout-minutes: 60
        run: |
          if [ "${{ matrix.target }}" = "javascript" ]; then
            ./fuzz/run --target javascript --runtime ${{ matrix.js_runtime }} -- ${{ matrix.suite }} ${{ matrix.iterations }} ${{ needs.seed.outputs.seed }}
          else
            ./fuzz/run --target erlang -- ${{ matrix.suite }} ${{ matrix.iterations }} ${{ needs.seed.outputs.seed }}
          fi
