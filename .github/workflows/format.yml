name: format

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  format:
    name: format (${{ matrix.project }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: root
            working_directory: .
          - project: fuzz
            working_directory: fuzz
          - project: benchmarks
            working_directory: benchmarks
          - project: examples
            working_directory: examples

    steps:
      - uses: actions/checkout@v4

      - name: Setup runtimes
        uses: ./.github/actions/setup

      - name: Check formatting
        working-directory: ${{ matrix.working_directory }}
        run: gleam format --check
