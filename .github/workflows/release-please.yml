name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check v1.0.0 baseline
        id: baseline
        run: |
          if git rev-parse -q --verify "refs/tags/v1.0.0^{commit}" >/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release automation starts after the v1.0.0 tag is created."
          fi

      - name: Require release token
        if: steps.baseline.outputs.ready == 'true'
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::Create the RELEASE_PLEASE_TOKEN repository secret before running releases."
            exit 1
          fi

      - name: Open release PR or draft GitHub Release
        if: steps.baseline.outputs.ready == 'true'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
